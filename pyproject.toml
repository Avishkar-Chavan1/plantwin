[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processtwin"
version = "0.1.0"
description = "Human-in-the-loop industrial process digital twin platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "passlib[bcrypt]>=1.7,<2",
  # passlib 1.7.4 is compatible with bcrypt 3.x; bcrypt 4.x has API changes.
  "bcrypt>=3.2,<6",
  "PyJWT>=2.9,<3",
  "email-validator>=2.2,<3",
  # Verified runtime: numpy 2.5.x / scipy 1.18.x. The former <2 / <1.14 caps contradicted
  # the environment this suite is actually run and verified in.
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "prometheus-client>=0.20,<1",
  "python-multipart>=0.0.9,<1",
  # Object storage is imported unconditionally by the API (dataset artifacts).
  "minio>=7.2,<9",
  # HTTP client used by historical connectors.
  "httpx>=0.27,<1",
  # Production image entry point (Dockerfile.api.prod) runs gunicorn.
  "gunicorn>=22,<24",
  # Optional readiness probe target: reports Redis health when REDIS_URL is configured.
  "redis>=5,<7",
]

[project.optional-dependencies]
# pytest >=9.0.3 clears PYSEC-2026-1845 (advisory gate runs pip-audit in CI);
# pytest-asyncio 1.x is the line compatible with the pytest 9 series.
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.6,<1", "mypy>=1.11,<2"]
mqtt = ["paho-mqtt>=2.1,<3"]
opcua = ["asyncua>=1.1,<2"]
parquet = ["pyarrow>=17,<25"]
mlflow = ["mlflow>=2.16,<4"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy.overrides]
module = ["asyncua", "asyncua.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The test temp root is resolved in tests/conftest.py: a fixed --basetemp (or the
# fixed OS `pytest-of-<user>` root) is created with mode 0o700, which on Windows is an
# owner-only ACL. If a different account on the host runs the suite first, every later
# account fails at session start with access denied. The conftest picks a writable
# per-account root instead, so this stays an ordinary `-q` invocation.
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "connectors", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Ruff formatter owns layout; long engineering identifiers and advisory text remain readable.

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["migrations"]
enable_incomplete_feature = ["NewGenericSyntax"]

# Optional extras are imported behind runtime capability checks; they may be absent
# from a minimal install (and pyarrow ships no stubs), so missing modules are tolerated.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
