services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: processtwin
      POSTGRES_USER: processtwin
      POSTGRES_PASSWORD: processtwin_dev_only
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processtwin -d processtwin"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  # minio disabled: repository access denied. Use local S3-compatible storage or self-host MinIO.
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address :9001
  #   environment:
  #     MINIO_ROOT_USER: processtwin-dev
  #     MINIO_ROOT_PASSWORD: processtwin-dev-password
  #   ports: ["9000:9000", "9001:9001"]
  #   volumes: [minio_data:/data]
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 10s
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://processtwin:processtwin_dev_only@postgres:5432/processtwin
      # No development default: an insecure signing key is rejected at startup.
      # Generate one in .env: python -c "import secrets; print(secrets.token_urlsafe(48))"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ORIGINS: http://localhost:3000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8000:8000"]
    depends_on:
      demo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  demo-init:
    build:
      context: .
      dockerfile: Dockerfile.api
    command:
      ["/bin/sh", "-c", "alembic upgrade head && python -m apps.simulator.processtwin_simulator.seed_demo --hours 168 && python -m apps.worker.processtwin_worker.train"]
    environment:
      DATABASE_URL: postgresql+psycopg://processtwin:processtwin_dev_only@postgres:5432/processtwin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # seed_demo refuses to run without an explicit demo identity (never production).
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://processtwin:processtwin_dev_only@postgres:5432/processtwin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      demo-init: {condition: service_completed_successfully}
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.4
    ports: ["3001:3000"]
    depends_on: [prometheus]
volumes:
  postgres_data:
  # minio_data: (disabled)
