# REFERENCE ONLY — do not apply this file with real values committed.
#
# The deployments read these keys from Secret `processtwin-secrets` in namespace
# `processtwin`. Create it out-of-band, from your secret manager or with:
#
#   kubectl -n processtwin create secret generic processtwin-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://processtwin_app:...@host:5432/processtwin' \
#     --from-literal=DATABASE_ADMIN_URL='postgresql+psycopg://owner:...@host:5432/processtwin' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=METRICS_TOKEN="$(openssl rand -base64 48)"
#
# Required keys:
#   DATABASE_URL        postgresql:// connection string for the API: the NON-OWNER
#                       app role (scripts/postgres_app_role.sql). RLS is only
#                       enforced against a non-owner, so do not reuse the owner here.
#   DATABASE_ADMIN_URL  owner/migrator connection string, used only by the
#                       migration init container and DBA runbook steps
#   JWT_SECRET          >= 32 characters, generated per environment, rotated on schedule
#   METRICS_TOKEN       >= 32 characters, separate from JWT_SECRET
#
# Optional keys (enable object storage):
#   MINIO_ACCESS_KEY
#   MINIO_SECRET_KEY
apiVersion: v1
kind: Secret
metadata:
  name: processtwin-secrets
  namespace: processtwin
  labels:
    app.kubernetes.io/name: processtwin
    app.kubernetes.io/part-of: processtwin-platform
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_NON_OWNER_POSTGRESQL_URL"
  DATABASE_ADMIN_URL: "REPLACE_WITH_OWNER_POSTGRESQL_URL"
  JWT_SECRET: "REPLACE_WITH_GENERATED_SECRET"
  METRICS_TOKEN: "REPLACE_WITH_GENERATED_TOKEN"
