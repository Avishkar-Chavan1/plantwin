# Kubernetes web workload (Next.js standalone server) with probes and a read-only root.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processtwin-web
  namespace: processtwin
  labels:
    app.kubernetes.io/name: processtwin-web
    app.kubernetes.io/part-of: processtwin-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: processtwin-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processtwin-web
        app.kubernetes.io/part-of: processtwin-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: processtwin/web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        # next/image optimization writes to .next/cache on a read-only root filesystem.
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: processtwin-web
  namespace: processtwin
  labels:
    app.kubernetes.io/name: processtwin-web
    app.kubernetes.io/part-of: processtwin-platform
spec:
  selector:
    app.kubernetes.io/name: processtwin-web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
